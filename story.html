<body>

    <div id="root"></div>
    <div id="portal-root"></div>

    <!-- Shared Libraries -->
    <script src="shared/core.js"></script>
    <script src="shared/menu-data.js"></script>
    <script src="shared/hooks.js"></script>
    <script type="text/babel" data-presets="react" src="shared/components.js"></script>

    <!-- Page-Specific Inline Script -->
    <script type="text/babel" data-presets="react">
        'use strict';

        const ASSET_BASE = 'https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/';

        const StoryIntro = () => (
            <section className="pt-32 pb-14 sm:pt-40 sm:pb-20 px-6 max-w-2xl mx-auto text-center">
                <Reveal variant="stamp" as="div" className="inline-block mb-8">
                    <span className="seal-mark seal-mark-lg jp-mark">物</span>
                </Reveal>
                <Reveal variant="rise" as="div">
                    <p className="jp-mark text-base text-forest-light/50 tracking-[0.3em]">物語</p>
                    <h1 className="script-head text-5xl sm:text-7xl text-forest mt-3">Our Story</h1>
                </Reveal>
            </section>
        );

        const Chapter = ({ kicker, title, children, drop }) => (
            <section className="px-6 max-w-2xl mx-auto py-10 sm:py-14">
                <Reveal variant="rise" stagger={0.1} as="div">
                    {kicker && <p className="sans-body text-[10px] uppercase tracking-[0.28em] text-forest-light/45 mb-3">{kicker}</p>}
                    <h2 className="script-head text-3xl sm:text-4xl text-forest mb-5">{title}</h2>
                    <div className={`serif-dish text-base sm:text-lg text-forest-light/85 leading-[1.75] space-y-5 ${drop ? 'story-drop' : ''}`}>
                        {children}
                    </div>
                </Reveal>
            </section>
        );

        const App = () => {
            useEffect(() => {
                try { sessionStorage.setItem('yokoso-entered', '1'); } catch (e) {}
                setTimeout(() => ScrollTrigger.refresh(), 400);
            }, []);

            return (
                <>
                    <SiteHeader />
                    <main id="main-content">
                        <StoryIntro />

                        <Chapter kicker="Beginning" title="Why Sylhet" drop>
                            <p>For a century this city has been sending cooks abroad. Sylheti
                            hands built kitchens in cities that had never tasted a whole spice,
                            and taught them to. The city has always been better at feeding
                            elsewhere than feeding itself.</p>
                            <p>Yokoso began with a small, stubborn idea: that the traffic should
                            run both ways. That a city which has fed the world deserves the world
                            back — not as an import, not as a novelty, but cooked properly,
                            at home, at a table you can walk to.</p>
                            <p>So we opened here. Not in Dhaka, where it would have been easier
                            and would have meant less.</p>
                        </Chapter>

                        <Plate
                            src={ASSET_BASE + 'yokoso-ramen.jpg'}
                            seal="炎"
                            kicker="The Kitchen"
                            line="Four kitchens, one pass."
                            height="short"
                        />

                        <Chapter kicker="The Table" title="Why Pan-Asian">
                            <p>The honest answer is that the borders were never really there.
                            Rice, fire, fermentation, broth, the discipline of a very hot wok and
                            a very sharp knife — these move across Asia far more freely than
                            the maps suggest. A Sichuan peppercorn and a Thai bird chilli are
                            having the same argument in two languages.</p>
                            <p>Choosing one cuisine and doing it narrowly would have been the
                            safer decision. It would also have been a smaller one. We would
                            rather hold dim sum, ramen, a wok fired hard enough to scar, and a
                            sushi counter in the same room, and be judged on whether each of
                            them is any good.</p>
                            <p>One hundred and twenty-one dishes. Five chapters. Nothing on the
                            menu is there to fill space.</p>
                        </Chapter>

                        <Chapter kicker="The Kitchen" title="The people behind it">
                            <p>A kitchen this wide only works if the people in it are specialists
                            rather than generalists. The sushi counter is not run by whoever is
                            free. The wok section is its own discipline, with its own timing and
                            its own heat, and it does not get borrowed from.</p>
                            <p>What holds it together is a single standard: nothing leaves the
                            pass that we would not happily eat ourselves, on a slow night, sitting
                            down. It is not a complicated philosophy. It is just expensive to
                            keep.</p>
                        </Chapter>

                        <Plate
                            src={ASSET_BASE + 'yokoso-dimsum.jpg'}
                            seal="歓"
                            kicker="Yōkoso"
                            line="Welcome — it is the first word we say."
                            height="short"
                        />

                        <Chapter kicker="Finally" title="What Yōkoso means">
                            <p>ようこそ. Welcome. It is the first word we chose and the
                            hardest one to keep.</p>
                            <p>Welcome is not a greeting at the door. It is the temperature of the
                            room, the pace of the water glass being refilled, whether anyone
                            notices you are waiting. It is what happens on a Tuesday when the
                            restaurant is half empty and nobody is watching.</p>
                            <p>We put it on the sign so that we would have to live up to it.</p>
                        </Chapter>
                    </main>
                    <Location />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        requestAnimationFrame(() => setTimeout(() => ScrollTrigger.refresh(), 200));
        window.addEventListener('load', () => setTimeout(() => ScrollTrigger.refresh(), 400));
    </script>
