<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Yōkoso — the full menu. One hundred and twenty-one dishes, in five chapters. Sylhet." />
    <meta name="theme-color" content="#0A0E0C" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yōkoso — The Menu" />
    <meta property="og:description" content="One hundred and twenty-one dishes, in five chapters." />
    <meta property="og:url" content="https://saqibfarabi14-del.github.io/Yokoso/menu.html" />
    <meta property="og:image" content="https://saqibfarabi14-del.github.io/Yokoso/assets/yokoso-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yōkoso — full Pan-Asian menu, Sylhet" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/yokoso-mark-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/yokoso-mark-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/yokoso-mark-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Spectral:wght@300;400;500&family=Inter:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="shared/tailwind-config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <link rel="stylesheet" href="shared/tokens.css" />
    <link rel="stylesheet" href="shared/styles.css" />
</head>
<body>

    <div id="root"></div>
    <div id="portal-root"></div>

    <script src="shared/core.js"></script>
    <script src="shared/menu-data.js"></script>
    <script src="shared/hooks.js"></script>
    <script type="text/babel" data-presets="react" src="shared/components.js"></script>

    <script type="text/babel" data-presets="react">
        'use strict';

        const ASSETS = 'https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/';

        const CHAPTER_PHOTOS = {
            'dim-sum':    ASSETS + 'yokoso-dimsum.jpg',
            'noodles':    ASSETS + 'yokoso-ramen.jpg',
            'chicken':    ASSETS + 'yokoso-wok.jpg',
            'sushi-half': ASSETS + 'yokoso-sushi.jpg'
            // 'desserts' has no photo — the sequence ends type-only, deliberately
        };

        /* Every dish appears exactly once. Total = 121. */
        const STRUCTURE = [
            { chapter: COMPASS_CHAPTERS[0], cats: [
                { id: 'dimSum',      title: 'Dim Sum',            items: MENU.dimSum },
                { id: 'appetizers',  title: 'Appetizers',         items: MENU.appetizers },
                { id: 'soup',        title: 'Soup',               items: MENU.soup },
                { id: 'salads',      title: 'Salads',             items: MENU.salads }
            ]},
            { chapter: COMPASS_CHAPTERS[1], cats: [
                { id: 'noodles',     title: 'Noodles',            items: MENU.noodles },
                { id: 'ramen',       title: 'Ramen',              items: MENU.ramen },
                { id: 'rice',        title: 'Rice',               items: MENU.rice }
            ]},
            { chapter: COMPASS_CHAPTERS[2], cats: [
                { id: 'chicken',     title: 'Chicken',            items: MENU.chicken },
                { id: 'beef',        title: 'Beef',               items: MENU.beef },
                { id: 'seafood',     title: 'Seafood',            items: MENU.seafood },
                { id: 'wholeFish',   title: 'Whole Fish',         items: MENU.wholeFish },
                { id: 'vegetable',   title: 'Vegetable',          items: MENU.vegetable }
            ]},
            { chapter: COMPASS_CHAPTERS[3], cats: [
                { id: 'sushiHF',     title: 'Sushi — Half / Full', items: MENU.sushi.filter(d => d.hasHalfFull) },
                { id: 'sushiOne',    title: 'Sushi',              items: MENU.sushi.filter(d => !d.hasHalfFull) },
                { id: 'sushiCombos', title: 'Sushi Combos',       items: MENU.sushiCombos },
                { id: 'bento',       title: 'Bento',              items: MENU.bento }
            ]},
            { chapter: COMPASS_CHAPTERS[4], cats: [
                { id: 'desserts',    title: 'Desserts',           items: MENU.desserts },
                { id: 'beverages',   title: 'Zero-Proof Bar',     items: MENU.beverages }
            ]}
        ];

        /* ===== Title ===== */
        const Title = () => (
            <section className="u-section" style={{ paddingTop: 'clamp(140px, 20vh, 220px)' }}>
                <div className="u-read text-center flex flex-col items-center">
                    <Seal size="l">味</Seal>
                    <Reveal className="flex flex-col items-center" stagger={0.08}>
                        <p className="t-jp t-label c-32" style={{ marginTop: 'var(--s3)' }}>お品書き</p>
                        <h1 className="t-xl c-bone" style={{ marginTop: 'var(--s2)' }}>The Menu</h1>
                    </Reveal>
                    <div className="rule" style={{ maxWidth: 64, marginTop: 'var(--s4)' }} />
                    <Reveal delay={0.15}>
                        <p className="t-body c-60" style={{ marginTop: 'var(--s4)' }}>
                            One hundred and twenty-one dishes, in five chapters.
                        </p>
                    </Reveal>
                </div>
            </section>
        );

        /* ===== Sticky chapter nav ===== */
        const ChapterNav = () => (
            <div className="sticky top-0 z-30"
                 style={{ background: 'rgba(10,14,12,0.90)', backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)', borderBottom: '1px solid var(--hairline)' }}>
                <div className="u-page">
                    <div className="snap-x hide-sb flex lg:justify-center overflow-x-auto"
                         style={{ gap: 'var(--s1)', paddingBlock: 'var(--s2)' }}>
                        {COMPASS_CHAPTERS.map(c => (
                            <a key={c.anchorId} href={`#${c.anchorId}`}
                               className="snap-i btn btn-sm"
                               style={{ gap: 8 }}>
                                <span className="t-jp c-verm" style={{ marginRight: 8 }}>{c.seal}</span>
                                {c.name}
                            </a>
                        ))}
                    </div>
                </div>
            </div>
        );

        /* ===== Legend ===== */
        const Legend = () => (
            <div className="u-page" style={{ paddingBlock: 'var(--s4)' }}>
                <p className="t-label c-32 flex items-center justify-center" style={{ gap: 'var(--s4)' }}>
                    <span className="inline-flex items-center" style={{ gap: 8 }}><SigMark /> Chef's signature</span>
                    <span className="inline-flex items-center" style={{ gap: 8 }}><SpiceMark level={3} /> Heat</span>
                </p>
            </div>
        );

        /* ===== Chapter ===== */
        const Chapter = ({ chapter, cats, photo, onDishClick }) => {
            const plateRef = useRef(null);
            const imgRef = useRef(null);

            useEffect(() => {
                if (!photo || !HAS_GSAP) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const ctx = gsap.context(() => {
                    gsap.fromTo(imgRef.current, { scale: 1.12 }, {
                        scale: 1, ease: 'none',
                        scrollTrigger: { trigger: plateRef.current, start: 'top bottom', end: 'bottom top', scrub: 1.2 }
                    });
                }, plateRef);
                return () => ctx.revert();
            }, [photo]);

            return (
                <section id={chapter.anchorId} className="anchor-offset" style={{ paddingBottom: 'clamp(64px, 9vh, 120px)' }}>
                    {photo ? (
                        <div ref={plateRef} className="u-bleed relative overflow-hidden" style={{ background: 'var(--ink)' }}>
                            <div className="absolute inset-0 overflow-hidden">
                                <img ref={imgRef} src={photo} alt="" aria-hidden="true" loading="lazy" decoding="async"
                                     className="w-full h-full object-cover" style={{ opacity: 0.40 }} />
                                <div className="absolute inset-0"
                                     style={{ background: 'linear-gradient(180deg, rgba(10,14,12,0.86) 0%, rgba(10,14,12,0.62) 50%, rgba(10,14,12,0.94) 100%)' }} />
                            </div>
                            <div className="relative u-page text-center flex flex-col items-center"
                                 style={{ paddingBlock: 'clamp(96px, 16vh, 200px)' }}>
                                <Seal size="s" light>{chapter.seal}</Seal>
                                <Reveal className="flex flex-col items-center" stagger={0.08}>
                                    <p className="t-jp t-sm c-60" style={{ marginTop: 'var(--s3)' }}>{chapter.native}</p>
                                    <h2 className="t-xl c-bone" style={{ marginTop: 'var(--s1)' }}>{chapter.name}</h2>
                                    <p className="t-sm c-60" style={{ marginTop: 'var(--s2)', maxWidth: '38ch' }}>{chapter.desc}</p>
                                </Reveal>
                            </div>
                        </div>
                    ) : (
                        <div className="u-page text-center flex flex-col items-center"
                             style={{ paddingBlock: 'clamp(72px, 12vh, 140px)' }}>
                            <Seal size="s">{chapter.seal}</Seal>
                            <Reveal className="flex flex-col items-center" stagger={0.08}>
                                <p className="t-jp t-sm c-60" style={{ marginTop: 'var(--s3)' }}>{chapter.native}</p>
                                <h2 className="t-xl c-bone" style={{ marginTop: 'var(--s1)' }}>{chapter.name}</h2>
                                <p className="t-sm c-60" style={{ marginTop: 'var(--s2)', maxWidth: '38ch' }}>{chapter.desc}</p>
                            </Reveal>
                        </div>
                    )}

                    <div className="u-page menu-cols" style={{ marginTop: 'var(--s7)' }}>
                        {cats.map(cat => (
                            <div key={cat.id} style={{ marginBottom: 'var(--s7)' }}>
                                <p className="t-label c-32" style={{ marginBottom: 'var(--s2)' }}>{cat.title}</p>
                                <div className="rule" style={{ marginBottom: 'var(--s1)' }} />
                                {cat.items.map(dish => (
                                    <DishRow key={dish.id} dish={dish} onClick={onDishClick} />
                                ))}
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        /* ===== APP ===== */
        const App = () => {
            const [selected, setSelected] = useState(null);

            useEffect(() => {
                const t = setTimeout(() => { if (HAS_GSAP) ScrollTrigger.refresh(); }, 400);
                return () => clearTimeout(t);
            }, []);

            return (
                <>
                    <SiteHeader />
                    <main id="main-content">
                        <Title />
                        <ChapterNav />
                        <Legend />
                        {STRUCTURE.map(({ chapter, cats }) => (
                            <Chapter key={chapter.anchorId}
                                     chapter={chapter}
                                     cats={cats}
                                     photo={CHAPTER_PHOTOS[chapter.anchorId]}
                                     onDishClick={setSelected} />
                        ))}
                    </main>
                    <Footer />
                    <DishSheet dish={selected} isOpen={!!selected} onClose={() => setSelected(null)} />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        requestAnimationFrame(() => setTimeout(() => { if (HAS_GSAP) ScrollTrigger.refresh(); }, 200));
        window.addEventListener('load', () => setTimeout(() => { if (HAS_GSAP) ScrollTrigger.refresh(); }, 400));
    </script>
</body>
</html>
