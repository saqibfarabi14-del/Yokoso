<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://saqibfarabi14-del.github.io/Yokoso/assets/yokoso-og.jpg" />
    <meta name="theme-color" content="#F7F2E8" />
    <link rel="canonical" href="https://saqibfarabi14-del.github.io/Yokoso/menu.html" />
    <script type="application/ld+json">
{
          "@context": "https://schema.org",
          "@type": "Menu",
          "@id": "https://saqibfarabi14-del.github.io/Yokoso/menu.html#menu",
          "name": "Yōkoso Menu",
          "url": "https://saqibfarabi14-del.github.io/Yokoso/menu.html",
          "inLanguage": "en",
          "provider": {
                "@type": "Restaurant",
                "@id": "https://saqibfarabi14-del.github.io/Yokoso/#restaurant",
                "name": "Yōkoso"
          }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/greatvibes/v21/RWmMoKWR9v4ksMfaWd_JN9XLiaQ6DQ.woff2" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/yokoso-mark-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/yokoso-mark-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/yokoso-mark-180.png" />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="shared/tailwind-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
    <div id="root"></div>
    <div id="portal-root"></div>
    <script src="shared/core.js"></script>
    <script src="shared/menu-data.js"></script>
    <script src="shared/hooks.js"></script>
    <script type="text/babel" data-presets="react" src="shared/components.js"></script>
    <script type="text/babel" data-presets="react">
        'use strict';

        const MenuIntro = () => (
            <section className="pt-28 pb-8 sm:pt-32 sm:pb-12 px-4 sm:px-8 max-w-3xl mx-auto text-center">
                <Reveal variant="stamp" as="div" className="inline-block mb-4">
                    <span className="seal-mark seal-mark-lg">味</span>
                </Reveal>
                <Reveal variant="rise" as="div">
                    <h1 className="script-head text-5xl sm:text-7xl text-forest">The Menu</h1>
                    <p className="sans-body text-sm text-forest-light/80 mt-3">Pan-Asian flavours, crafted with intention</p>
                </Reveal>
            </section>
        );

        const ChapterNav = () => (
            <div className="sticky top-16 z-20 bg-bone/95 backdrop-blur-md py-3 border-b border-forest/5 w-full">
                <div className="snap-container hide-scrollbar flex overflow-x-auto justify-center gap-2 px-4 sm:px-8 touch-pan-x">
                    {COMPASS_CHAPTERS.map(chapter => (
                        <a
                            key={chapter.anchorId}
                            href={`#${chapter.anchorId}`}
                            className="snap-item tap-target flex-shrink-0 px-4 py-2 rounded-full border border-forest/10 text-xs sm:text-sm text-forest/80 font-medium transition-colors hover:bg-forest/5 active:bg-forest/10 whitespace-nowrap min-h-[40px] flex items-center gap-1.5"
                        >
                            <span className="text-vermilion">{chapter.seal}</span> {chapter.name}
                        </a>
                    ))}
                </div>
            </div>
        );

        const MenuChapter = ({ chapter, categories, onDishClick, photo }) => (
            <section id={chapter.anchorId} className="scroll-mt-20 py-10 sm:py-16 px-4 sm:px-8 max-w-3xl mx-auto">
                {photo ? (
                    <div className="relative -mx-4 sm:-mx-8 mb-10 sm:mb-14 overflow-hidden bg-ink">
                        <div className="absolute inset-0">
                            <img src={photo} alt="" aria-hidden="true" loading="lazy" decoding="async"
                                 className="w-full h-full object-cover" style={{ opacity: 0.5 }} />
                            <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg, rgba(14,26,23,0.80) 0%, rgba(14,26,23,0.45) 50%, rgba(14,26,23,0.88) 100%)' }} />
                        </div>
                        <div className="relative z-10 text-center py-16 sm:py-24 px-6">
                            <Reveal variant="stamp" as="div" className="inline-block mb-3">
                                <span className="seal-mark seal-mark-sm" style={{ borderColor: 'rgba(247,242,232,0.55)', color: '#F7F2E8', background: 'rgba(247,242,232,0.04)' }}>{chapter.seal}</span>
                            </Reveal>
                            <Reveal variant="rise" as="div">
                                <p className="jp-mark text-lg sm:text-xl text-bone/60">{chapter.native}</p>
                                <h2 className="script-head text-4xl sm:text-6xl text-bone mt-1">{chapter.name}</h2>
                                <p className="sans-body text-xs sm:text-sm text-bone/60 mt-3 max-w-md mx-auto">{chapter.desc}</p>
                            </Reveal>
                        </div>
                    </div>
                ) : (
                    <div className="text-center mb-8 sm:mb-12">
                        <Reveal variant="stamp" as="div" className="inline-block mb-3">
                            <span className="seal-mark seal-mark-sm">{chapter.seal}</span>
                        </Reveal>
                        <Reveal variant="rise" as="div">
                            <p className="jp-mark text-lg sm:text-xl text-forest-light/80">{chapter.native}</p>
                            <h2 className="serif-head text-3xl sm:text-5xl text-forest mt-1">{chapter.name}</h2>
                            <p className="sans-body text-xs sm:text-sm text-forest-light/80 mt-2 max-w-md mx-auto">{chapter.desc}</p>
                        </Reveal>
                    </div>
                )}
                {categories.map(cat => (
                    <div key={cat.id} className="mb-8 sm:mb-10 last:mb-0">
                        <h3 className="serif-head text-lg sm:text-xl text-forest/70 mb-2 sm:mb-3 uppercase tracking-wide text-sm">{cat.title}</h3>
                        <div>
                            {cat.items.map(dish => (
                                <DishCard key={dish.id} dish={dish} onClick={onDishClick} compact={true} />
                            ))}
                        </div>
                    </div>
                ))}
            </section>
        );

        const MENU_STRUCTURE = [
            { chapter: COMPASS_CHAPTERS[0], categories: [
                { id: 'dim-sum', title: 'Dim Sum', items: MENU.dimSum },
                { id: 'appetizers', title: 'Appetizers', items: MENU.appetizers },
                { id: 'soup', title: 'Soup', items: MENU.soup },
                { id: 'salads', title: 'Salads', items: MENU.salads },
            ]},
            { chapter: COMPASS_CHAPTERS[1], categories: [
                { id: 'noodles', title: 'Noodles', items: MENU.noodles },
                { id: 'ramen', title: 'Ramen', items: MENU.ramen },
                { id: 'rice', title: 'Rice', items: MENU.rice },
            ]},
            { chapter: COMPASS_CHAPTERS[2], categories: [
                { id: 'chicken', title: 'Chicken', items: MENU.chicken },
                { id: 'beef', title: 'Beef', items: MENU.beef },
                { id: 'seafood', title: 'Seafood', items: MENU.seafood },
                { id: 'whole-fish', title: 'Whole Fish', items: MENU.wholeFish },
                { id: 'vegetable', title: 'Vegetable', items: MENU.vegetable },
            ]},
            { chapter: COMPASS_CHAPTERS[3], categories: [
                { id: 'sushi-half', title: 'Sushi (Half / Full)', items: MENU.sushi.filter(i => i.hasHalfFull) },
                { id: 'sushi-single', title: 'Sushi (Single Price)', items: MENU.sushi.filter(i => !i.hasHalfFull) },
                { id: 'sushi-combos', title: 'Sushi Combos', items: MENU.sushiCombos },
                { id: 'bento', title: 'Bento', items: MENU.bento },
            ]},
            { chapter: COMPASS_CHAPTERS[4], categories: [
                { id: 'desserts', title: 'Desserts', items: MENU.desserts },
                { id: 'beverages', title: 'Zero-Proof Bar', items: MENU.beverages },
            ]},
        ];

        const ASSET_BASE = 'https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/';
        const CHAPTER_PHOTOS = {
            'dim-sum':    ASSET_BASE + 'yokoso-dimsum.jpg',
            'noodles':    ASSET_BASE + 'yokoso-ramen.jpg',
            'chicken':    ASSET_BASE + 'yokoso-wok.jpg',
            'sushi-half': ASSET_BASE + 'yokoso-sushi.jpg',
            // 'desserts' intentionally has no photo — Sweet & Cool stays
            // purely typographic, giving the sequence a quiet ending
        };

        const App = () => {
            const [selectedDish, setSelectedDish] = useState(null);

            return (
                <>
                    <SiteHeader />
                    <main id="main-content">
                        <MenuIntro />
                        <ChapterNav />
                        <div className="max-w-3xl mx-auto px-4 sm:px-8 pt-6 pb-2">
                            <p className="sans-body text-[10px] uppercase tracking-[0.18em] text-forest-light/45 flex items-center justify-center gap-5">
                                <span className="inline-flex items-center gap-1.5"><SignatureStar active={true} /> Chef's signature</span>
                                <span className="inline-flex items-center gap-1.5"><SpiceIcons level={3} /> Heat</span>
                            </p>
                        </div>
                        {MENU_STRUCTURE.map(({ chapter, categories }) => (
                            <MenuChapter
                                key={chapter.anchorId}
                                chapter={chapter}
                                categories={categories}
                                onDishClick={setSelectedDish}
                                photo={CHAPTER_PHOTOS[chapter.anchorId]}
                            />
                        ))}
                    </main>
                    <Location />
                    <DishDetail dish={selectedDish} isOpen={!!selectedDish} onClose={() => setSelectedDish(null)} />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        requestAnimationFrame(() => setTimeout(() => ScrollTrigger.refresh(), 200));
        window.addEventListener('load', () => setTimeout(() => ScrollTrigger.refresh(), 400));
    </script>
</body>
</html>
