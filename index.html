    <!-- Preload Hero Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/greatvibes/v21/RWmMoKWR9v4ksMfaWd_JN9XLiaQ6DQ.woff2" />

    <link rel="icon" type="image/png" sizes="16x16" href="assets/yokoso-mark-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/yokoso-mark-180.png" />

    <!-- Subsetted Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Babel (React JSX) -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <script src="shared/tailwind-config.js"></script>

    <!-- GSAP 3.13 + Bonus Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>

    <!-- Lenis -->
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- External Styles -->
    <link rel="stylesheet" href="shared/styles.css" />
</head>
<body>

    <div id="root"></div>
    <div id="portal-root"></div>

    <!-- Shared Libraries -->
    <script src="shared/core.js"></script>
    <script src="shared/menu-data.js"></script>
    <script src="shared/hooks.js"></script>
    <script type="text/babel" data-presets="react" src="shared/components.js"></script>

    <!-- Page-Specific Inline Script -->
    <script type="text/babel" data-presets="react">
        'use strict';

        // ---- Hero ----
        const Hero = () => {
            const heroRef = useRef(null);
            const sealRef = useRef(null);
            const textRef = useRef(null);
            const wordmarkRef = useRef(null);
            const buttonsRowRef = useRef(null);
            const underlineRef = useRef(null);


            useEffect(() => {
                if (!HAS_GSAP) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                let split;
                const ctx = gsap.context(() => {
                    const isMobile = window.innerWidth < 768;
                    const mult = isMobile ? 0.75 : 1;
                    try {
                        split = SplitText.create(wordmarkRef.current, { type: 'chars', mask: 'chars' });
                        gsap.fromTo(split.chars,
                            { yPercent: 110, opacity: 0 },
                            { yPercent: 0, opacity: 1, duration: MOTION.dur.xl * mult, stagger: 0.06, ease: MOTION.ease.out, delay: 0.3 }
                        );
                    } catch (e) {
                        gsap.fromTo(wordmarkRef.current, { y: 24, opacity: 0 },
                            { y: 0, opacity: 1, duration: MOTION.dur.md * mult, ease: MOTION.ease.out, delay: 0.3 }
                        );
                    }
                    const path = underlineRef.current?.querySelector('path');
                    if (path) {
                        const len = path.getTotalLength();
                        gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
                        gsap.to(path, { strokeDashoffset: 0, duration: MOTION.dur.xl * mult, ease: MOTION.ease.ink, delay: 0.9 });
                    }
                }, heroRef);
                return () => { ctx.revert(); if (split) split.revert(); };
            }, []);

            useEffect(() => {
                if (!HAS_GSAP) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const ctx = gsap.context(() => {
                    const tl = gsap.timeline({
                        scrollTrigger: { trigger: heroRef.current, start: 'top top', end: 'bottom top', scrub: 1 }
                    });
                    tl.to(textRef.current,      { yPercent: -30, opacity: 0 }, 0)
                      .to(sealRef.current,      { yPercent: -60, scale: 0.8 }, 0)
                      .to(buttonsRowRef.current,{ opacity: 0 }, 0);
                }, heroRef);
                return () => ctx.revert();
            }, []);

            const showVideo = HERO_VIDEO_SRC && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && !(navigator.connection && navigator.connection.saveData);

            return (
                <section ref={heroRef} className="relative min-h-screen flex items-center justify-center px-4 sm:px-8 overflow-hidden">
                    {showVideo && (
                        <video
                            className="absolute inset-0 w-full h-full object-cover opacity-[0.18] pointer-events-none"
                            src={HERO_VIDEO_SRC} autoPlay muted loop playsInline preload="none" aria-hidden="true"
                        />
                    )}
                    <div className="relative z-10 text-center max-w-3xl mx-auto">
                        <div ref={sealRef} className="flex justify-center mb-6 sm:mb-10">
                            <Reveal variant="stamp" as="div" className="inline-block">
                                <div className="seal-mark seal-mark-lg hero-seal relative">歓</div>
                            </Reveal>
                        </div>
                        <div ref={textRef}>
                            <h1 ref={wordmarkRef} className="script-head text-[clamp(2.2rem,11vw,5.5rem)] text-forest hero-line" style={{ letterSpacing: '0.12em', textIndent: '0.12em' }}>YŌKOSO</h1>
                            <svg ref={underlineRef} className="mx-auto mt-2 sm:mt-3 block" width="180" height="14" viewBox="0 0 180 14" style={{ maxWidth: '40%' }} aria-hidden="true">
                                <path d="M4,8 Q45,2 90,7 T176,6" fill="none" stroke="#D43A2F" strokeWidth="2.5" strokeLinecap="round" />
                            </svg>
                            <Reveal variant="rise" stagger={0.12} delay={1.1} as="div" className="mt-1 sm:mt-2">
                                <p className="serif-head text-[clamp(1rem,3vw,2rem)] text-forest-light/80 hero-line tracking-wide">Pan-Asian Restaurant</p>
                                <p className="sans-body text-xs sm:text-base text-forest-light/80 mt-3 max-w-[280px] sm:max-w-md mx-auto hero-line">Al Madani Tower (2nd Floor), Mirboxtula, Sylhet.</p>
                            </Reveal>
                        </div>
                        <div ref={buttonsRowRef} className="mt-6 sm:mt-10 hero-line flex flex-wrap justify-center gap-3 sm:gap-4">
                            <Reveal variant="rise" stagger={0.12} delay={1.4} as="div" className="flex flex-wrap justify-center gap-3 sm:gap-4">
                                <a href={WHATSAPP_RESERVE_URL} target="_blank" rel="noopener noreferrer" className="magnetic-btn text-sm sm:text-base">Reserve a Table</a>
                                <a href="menu.html" className="magnetic-btn magnetic-btn-outline text-sm sm:text-base">Explore Menu</a>
                            </Reveal>
                        </div>
                    </div>
                </section>
            );
        };

        // ---- About (with id="about" and updated hours + tagline) ----
        const About = () => {
            return (
                <section id="about" className="py-12 sm:py-24 px-4 sm:px-8 max-w-4xl mx-auto text-center">
                    <Reveal variant="ink" as="div" className="w-full">
                        <div className="relative">
                            <Reveal variant="rise" stagger={0.15} as="div">
                                <p className="about-line script-head text-2xl sm:text-3xl text-forest-light/70">一皿 一皿</p>
                                <p className="about-line serif-head text-xl sm:text-2xl text-forest-light/80 mt-2 italic">Every dish tells a story — from our kitchen to your table.</p>
                                <h2 className="about-line serif-head text-2xl sm:text-4xl text-forest mt-2">Where the East meets the East</h2>
                                <p className="about-line sans-body text-sm sm:text-lg text-forest-light/80 mt-3 leading-relaxed max-w-2xl mx-auto">At Yokoso, we honour the culinary threads that bind Asia—from the bustling streets of Tokyo to the spice gardens of Bangkok, from Seoul's fermented traditions to the tropical soul of Manila. Every dish is a conversation, every plate a journey.</p>
                                <div className="about-line h-px bg-forest/10 w-20 mx-auto my-5" />
                                <p className="about-line sans-body text-xs sm:text-sm text-forest-light/80">Al Madani Tower (2nd Floor), Mirboxtula, Sylhet.<br />Open daily · 12:30 PM – 11:00 PM (Fri from 2:00 PM)</p>
                            </Reveal>
                        </div>
                    </Reveal>
                </section>
            );
        };

        // ---- Reservation ----
        const Reservation = () => (
            <section className="py-16 sm:py-28 px-4 sm:px-8 bg-forest text-bone relative overflow-hidden">
                <div className="relative max-w-2xl mx-auto text-center">
                    <Reveal variant="stamp" as="div" className="inline-block mb-6">
                        <span className="seal-mark seal-mark-lg" style={{ borderColor: '#F7F2E8', color: '#F7F2E8' }}>席</span>
                    </Reveal>
                    <Reveal variant="rise" stagger={0.12} as="div">
                        <h2 className="script-head text-5xl sm:text-7xl">Reserve Your Table</h2>
                        <p className="sans-body text-sm sm:text-base text-bone/70 mt-4 max-w-md mx-auto">
                            Open daily · 12:30 PM – 11:00 PM (Fri from 2:00 PM)
                        </p>
                        <a
                            href={WHATSAPP_RESERVE_URL}
                            target="_blank" rel="noopener noreferrer"
                            className="magnetic-btn mt-8 inline-flex"
                            style={{ background: '#D43A2F' }}
                        >
                            Reserve on WhatsApp
                        </a>
                        <p className="sans-body text-xs text-bone/50 mt-6">
                            Or call <a href={`tel:+${RESERVATION_PHONE}`} className="underline-draw">01841965676</a>
                        </p>
                    </Reveal>
                </div>
            </section>
        );

        // ---- App ----
        const App = () => {
            const [selectedDish, setSelectedDish] = useState(null);

            const handleResize = useCallback(() => {
                ScrollTrigger.refresh();
            }, []);

            useEffect(() => {
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, [handleResize]);

            return (
                <>
                    <a href="menu.html" className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-vermilion focus:text-bone focus:px-4 focus:py-2 focus:rounded">Skip to menu</a>
                    <SiteHeader />
                    <main id="main-content">
                        <Hero />
                        <About />
                        <MenuCompass />
                        <LazySection className="w-full"><ChefSignatures onDishClick={setSelectedDish} /></LazySection>
                        <LazySection className="w-full"><CinematicCollections /></LazySection>
                        <Reservation />
                    </main>
                    <Location showReservationCTA={false} />
                    <DishDetail dish={selectedDish} isOpen={!!selectedDish} onClose={() => setSelectedDish(null)} />
                </>
            );
        };

        // ---- RENDER ----
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        requestAnimationFrame(() => setTimeout(() => ScrollTrigger.refresh(), 200));
        window.addEventListener('load', () => setTimeout(() => ScrollTrigger.refresh(), 400));
    </script>
</body>
</html>
