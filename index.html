<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Yōkoso — Pan-Asian Restaurant in Sylhet. Japanese, Chinese and Thai, from dim sum to sushi." />
    <meta name="theme-color" content="#0A0E0C" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yōkoso — Pan-Asian Restaurant" />
    <meta property="og:description" content="Al Madani Tower (2nd Floor), Mirboxtula, Sylhet." />
    <meta property="og:url" content="https://saqibfarabi14-del.github.io/Yokoso/" />
    <meta property="og:image" content="https://saqibfarabi14-del.github.io/Yokoso/assets/yokoso-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yōkoso — Pan-Asian Restaurant, Sylhet" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/yokoso-mark-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/yokoso-mark-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/yokoso-mark-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Spectral:wght@300;400;500&family=Inter:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="shared/tailwind-config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <link rel="stylesheet" href="shared/tokens.css" />
    <link rel="stylesheet" href="shared/styles.css" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Yokoso",
      "servesCuisine": ["Japanese", "Chinese", "Thai", "Pan-Asian"],
      "priceRange": "৳৳",
      "telephone": "+8801841965676",
      "url": "https://saqibfarabi14-del.github.io/Yokoso/",
      "hasMenu": "https://saqibfarabi14-del.github.io/Yokoso/menu.html",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Al Madani Tower, 2nd Floor, Mirboxtula",
        "addressLocality": "Sylhet",
        "addressCountry": "BD"
      },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday"],
          "opens": "12:30", "closes": "23:00" },
        { "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Friday", "opens": "14:00", "closes": "23:00" }
      ]
    }
    </script>
</head>
<body>

    <div id="root"></div>
    <div id="portal-root"></div>

    <script src="shared/core.js"></script>
    <script src="shared/menu-data.js"></script>
    <script src="shared/hooks.js"></script>
    <script type="text/babel" data-presets="react" src="shared/components.js"></script>

    <script type="text/babel" data-presets="react">
        'use strict';

        const ASSETS = 'https://raw.githubusercontent.com/saqibfarabi14-del/Yokoso/main/assets/';

        /* ===== §1 HERO ===== */
        const Hero = () => {
            const secRef = useRef(null);
            const videoRef = useRef(null);
            const contentRef = useRef(null);
            const cueRef = useRef(null);

            const showVideo = !window.matchMedia('(prefers-reduced-motion: reduce)').matches
                && !(navigator.connection && navigator.connection.saveData);

            useEffect(() => {
                if (!HAS_GSAP) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const ctx = gsap.context(() => {
                    const tl = gsap.timeline({
                        scrollTrigger: { trigger: secRef.current, start: 'top top', end: 'bottom top', scrub: 1 }
                    });
                    tl.to(contentRef.current, { yPercent: -22, opacity: 0 }, 0);
                    if (videoRef.current) tl.to(videoRef.current, { scale: 1.15, opacity: 0.04 }, 0);

                    if (cueRef.current) {
                        gsap.fromTo(cueRef.current,
                            { scaleY: 0, transformOrigin: 'top' },
                            { scaleY: 1, duration: 1.2, ease: 'power2.inOut', repeat: -1, yoyo: true, repeatDelay: 0.2 });
                    }
                }, secRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={secRef} className="relative flex items-center justify-center overflow-hidden"
                         style={{ minHeight: '100svh' }}>
                    {showVideo && (
                        <video ref={videoRef}
                            className="absolute inset-0 w-full h-full object-cover pointer-events-none"
                            style={{ opacity: 0.22 }}
                            src={ASSETS + 'yokoso-hero-ink-loop.mp4'}
                            autoPlay muted loop playsInline preload="none" aria-hidden="true" />
                    )}
                    <div className="absolute inset-0 pointer-events-none"
                         style={{ background: 'radial-gradient(120% 90% at 50% 40%, transparent 0%, var(--ink) 78%)' }} />

                    <div ref={contentRef} className="u-page relative text-center flex flex-col items-center">
                        <Seal size="l">歓</Seal>
                        <SplitLine text="YŌKOSO" className="t-hero c-bone" delay={0.3} />
                        <Reveal className="flex flex-col items-center" delay={1.1} stagger={0.1}>
                            <p className="t-label c-32" style={{ marginTop: 'var(--s3)' }}>Pan-Asian · Sylhet</p>
                        </Reveal>
                        <Reveal className="flex flex-wrap items-center justify-center" delay={1.35} stagger={0.08}>
                            <span style={{ display: 'inline-flex', gap: 'var(--s2)', marginTop: 'var(--s5)', flexWrap: 'wrap', justifyContent: 'center' }}>
                                <a href="menu.html" className="btn btn-solid">The Menu</a>
                                <a href="#reserve" className="btn">Reserve</a>
                            </span>
                        </Reveal>
                    </div>

                    <div className="absolute" style={{ bottom: 'var(--s5)', left: '50%', transform: 'translateX(-50%)' }} aria-hidden="true">
                        <span ref={cueRef} style={{ display: 'block', width: 1, height: 56, background: 'var(--bone-32)' }} />
                    </div>
                </section>
            );
        };

        /* ===== §2 THE ROOM ===== */
        const TheRoom = () => {
            const secRef = useRef(null);
            const imgRef = useRef(null);

            const showAmbient = !window.matchMedia('(prefers-reduced-motion: reduce)').matches
                && !(navigator.connection && navigator.connection.saveData);

            useEffect(() => {
                if (!HAS_GSAP) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const ctx = gsap.context(() => {
                    gsap.fromTo(imgRef.current, { scale: 1.14 }, {
                        scale: 1, ease: 'none',
                        scrollTrigger: { trigger: secRef.current, start: 'top bottom', end: 'bottom top', scrub: 1.2 }
                    });
                }, secRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={secRef} className="relative flex items-end overflow-hidden" style={{ minHeight: '92svh' }}>
                    <div className="absolute inset-0 overflow-hidden">
                        {showAmbient && (
                            <video
                                className="absolute inset-0 w-full h-full object-cover pointer-events-none"
                                style={{ opacity: 0.5, mixBlendMode: 'screen' }}
                                src={ASSETS + 'yokoso-ink-bloom.mp4'}
                                autoPlay muted loop playsInline preload="none" aria-hidden="true" />
                        )}
                        <img ref={imgRef} src={ASSETS + 'yokoso-sushi.jpg'} alt="" aria-hidden="true"
                             loading="lazy" decoding="async"
                             className="w-full h-full object-cover" style={{ opacity: 0.42 }} />
                        <div className="absolute inset-0"
                             style={{ background: 'linear-gradient(180deg, rgba(10,14,12,0.55) 0%, rgba(10,14,12,0.35) 45%, var(--ink) 100%)' }} />
                    </div>

                    <div className="u-page relative" style={{ paddingBottom: 'var(--s9)' }}>
                        <Reveal stagger={0.09}>
                            <p className="t-label c-32" style={{ marginBottom: 'var(--s4)' }}>The Room</p>
                            <p className="t-xl c-bone">A dark room.</p>
                            <p className="t-xl c-bone">An open counter.</p>
                            <p className="t-xl c-bone">One hundred and twenty-one dishes.</p>
                        </Reveal>
                        <Reveal delay={0.25}>
                            <p className="t-body c-60" style={{ marginTop: 'var(--s4)', maxWidth: '44ch' }}>
                                Yōkoso holds Japan, China and Thailand on a single menu — not as a
                                compromise, but because the borders were never really there.
                            </p>
                        </Reveal>
                    </div>
                </section>
            );
        };

        /* ===== §3 THE TABLE ===== */
        const TheTable = ({ onDishClick }) => {
            const picks = Object.values(MENU).flat().filter(d => d.signature).slice(0, 6);

            return (
                <section className="u-section">
                    <div className="u-page">
                        <Reveal>
                            <p className="t-label c-32">Chef's Signatures</p>
                        </Reveal>
                        <div className="rule" style={{ marginTop: 'var(--s4)' }} />

                        <div>
                            {picks.map((dish, i) => (
                                <Reveal key={dish.id}>
                                    <button
                                        onClick={() => onDishClick(dish)}
                                        className="w-full text-left flex items-baseline"
                                        style={{ paddingBlock: 'var(--s4)', borderBottom: '1px solid var(--hairline)' }}
                                    >
                                        <span className="t-label c-32" style={{ width: 46, flexShrink: 0 }}>
                                            {String(i + 1).padStart(2, '0')}
                                        </span>
                                        <span className="t-l c-bone" style={{ flexShrink: 1, minWidth: 0 }}>
                                            {dish.name}
                                        </span>
                                        <span className="leader" aria-hidden="true" />
                                        <span className="t-sm c-60" style={{ whiteSpace: 'nowrap', flexShrink: 0 }}>
                                            {dish.hasHalfFull ? `${dish.priceHalf} / ${dish.priceFull}` : dish.price} BDT
                                        </span>
                                    </button>
                                </Reveal>
                            ))}
                        </div>

                        <Reveal delay={0.15}>
                            <p className="t-sm c-60" style={{ marginTop: 'var(--s5)' }}>
                                Six of one hundred and twenty-one.{' '}
                                <a href="menu.html" className="link-u c-bone">See the full menu →</a>
                            </p>
                        </Reveal>
                    </div>
                </section>
            );
        };

        /* ===== §4 RESERVE ===== */
        const ReserveSection = () => {
            const showAmbient = !window.matchMedia('(prefers-reduced-motion: reduce)').matches
                && !(navigator.connection && navigator.connection.saveData);

            return (
            <section id="reserve" className="u-section anchor-offset relative overflow-hidden">
                {showAmbient && (
                    <video
                        className="absolute pointer-events-none"
                        style={{
                            opacity: 0.16, mixBlendMode: 'screen',
                            left: '50%', bottom: 0, transform: 'translateX(-50%)',
                            width: 'min(60vw, 640px)', height: '100%', objectFit: 'cover', objectPosition: 'bottom'
                        }}
                        src={ASSETS + 'yokoso-steam.mp4'}
                        autoPlay muted loop playsInline preload="none" aria-hidden="true" />
                )}
                <div className="u-read relative text-center">
                    <Seal size="l" light>席</Seal>
                    <Reveal stagger={0.08}>
                        <h2 className="t-xl c-bone" style={{ marginTop: 'var(--s3)' }}>Reserve</h2>
                        <p className="t-sm c-60" style={{ marginTop: 'var(--s2)' }}>
                            Open daily · 12:30 – 23:00 · Friday from 14:00
                        </p>
                    </Reveal>
                    <div style={{ marginTop: 'var(--s6)' }}>
                        <Reserve />
                    </div>
                    <p className="t-label c-32" style={{ marginTop: 'var(--s4)' }}>
                        or call <a href={`tel:+${RESERVATION_PHONE}`} className="link-u c-60">01841965676</a>
                    </p>
                </div>
            </section>
            );
        };

        /* ===== APP ===== */
        const App = () => {
            const [selected, setSelected] = useState(null);

            useEffect(() => {
                const t = setTimeout(() => { if (HAS_GSAP) ScrollTrigger.refresh(); }, 400);
                return () => clearTimeout(t);
            }, []);

            return (
                <>
                    <a href="menu.html" className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 btn">Skip to menu</a>
                    <SiteHeader />
                    <main id="main-content">
                        <Hero />
                        <TheRoom />
                        <TheTable onDishClick={setSelected} />
                        <ReserveSection />
                    </main>
                    <Footer />
                    <DishSheet dish={selected} isOpen={!!selected} onClose={() => setSelected(null)} />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        requestAnimationFrame(() => setTimeout(() => { if (HAS_GSAP) ScrollTrigger.refresh(); }, 200));
        window.addEventListener('load', () => setTimeout(() => { if (HAS_GSAP) ScrollTrigger.refresh(); }, 400));
    </script>
</body>
</html>
