    <style>
        /* ===== MOTION TOKENS (CSS) ===== */
        :root {
            --dur-xs: 150ms;
            --dur-sm: 300ms;
            --dur-md: 600ms;
            --dur-lg: 900ms;
            --dur-xl: 1400ms;
            --ease-out: cubic-bezier(0.16, 1, 0.30, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --ease-stamp: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-ink: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        /* Reset & base */
        * { margin:0; padding:0; box-sizing:border-box; }
        html { background:#F7F2E8; scroll-behavior: smooth; }
        body { background:#F7F2E8; font-family:'Inter',sans-serif; color:#16302B; overflow-x:hidden; position:relative; }

        /* ===== NO-MOTION FALLBACK ===== */
        .no-motion .word-reveal span { transform: translateY(0) !important; opacity: 1 !important; }
        .no-motion .wipe-mask { clip-path: inset(0 0% 0 0) !important; }
        .no-motion .botanical-svg path { stroke-dashoffset: 0 !important; }

        /* ===== BOTANICAL CSS ===== */
        .botanical-svg path, .botanical-svg circle { fill: none; stroke: #16302B; stroke-width: 1.2; stroke-linecap: round; }
        .botanical-bg {
            background: radial-gradient(circle at 10% 20%, rgba(22,48,43,0.06) 0%, transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(22,48,43,0.06) 0%, transparent 60%);
            opacity: 0.6;
            pointer-events: none;
        }

        /* ===== PAPER GRAIN TEXTURE ===== */
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            mix-blend-mode: multiply; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-size: 512px 512px;
        }
        #root { position:relative; z-index:1; }

        /* ===== KEYBOARD NAVIGATION ===== */
        *:focus-visible { outline: 2px solid #D43A2F; outline-offset: 3px; border-radius: 4px; }
        a, button { cursor: pointer; }

        /* Custom cursor – disabled on touch devices */
        .cursor-dot, .cursor-ring { display:none; }
        @media (hover:hover) and (pointer:fine) {
            body.cursor-active { cursor:none; }
            body.cursor-active .cursor-dot, body.cursor-active .cursor-ring { display:block; }
            .cursor-dot, .cursor-ring {
                position:fixed; top:0; left:0; pointer-events:none; z-index:9999;
                border-radius:50%; transform:translate(-50%,-50%);
                transition:width 0.2s, height 0.2s, background 0.2s;
            }
            .cursor-dot { width:8px; height:8px; background:#D43A2F; }
            .cursor-ring { width:40px; height:40px; border:1.5px solid #16302B; transition:width 0.3s,height 0.3s,border-color 0.3s; }
            .cursor-ring.hover { width:64px; height:64px; border-color:#D43A2F; background:rgba(212,58,47,0.06); }
        }

        /* scrollbar */
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:#ede6d8; }
        ::-webkit-scrollbar-thumb { background:#16302B; border-radius:4px; }

        /* Typography helpers */
        .script-head { font-family:'Great Vibes',cursive; font-weight:400; letter-spacing:0.02em; }
        .serif-head { font-family:'Playfair Display',serif; font-weight:600; }
        .serif-dish { font-family:'Playfair Display',serif; font-weight:500; }
        .sans-body { font-family:'Inter',sans-serif; font-weight:300; }

        /* Magnetic button */
        .magnetic-btn {
            display:inline-flex; align-items:center; justify-content:center;
            padding:0.75rem 2rem; border-radius:40px;
            background:#16302B; color:#F7F2E8;
            font-family:'Inter',sans-serif; font-weight:400; font-size:0.95rem;
            letter-spacing:0.04em; border:none; transition:transform 0.15s ease, background 0.3s ease;
            cursor:pointer; position:relative; overflow:hidden; min-height:44px;
        }
        .magnetic-btn:active { transform:scale(0.95); }
        .magnetic-btn-outline { background:transparent; border:1.5px solid #16302B; color:#16302B; }
        @media (hover:hover) and (pointer:fine) {
            .magnetic-btn::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0.04); border-radius:40px; transform:scaleX(0); transform-origin:left; transition:transform 0.4s ease; }
            .magnetic-btn:hover::after { transform:scaleX(1); }
            .magnetic-btn-outline::after { background:rgba(22,48,43,0.04); }
            .magnetic-btn-outline:hover { background:rgba(22,48,43,0.04); }
        }

        /* Underline draw – disabled on mobile */
        .underline-draw { position:relative; text-decoration:none; color:inherit; }
        @media (hover:hover) and (pointer:fine) {
            .underline-draw::after { content:''; position:absolute; left:0; bottom:-2px; width:0; height:1.5px; background:#D43A2F; transition:width 0.45s cubic-bezier(0.23,1,0.32,1); }
            .underline-draw:hover::after { width:100%; }
        }

        /* Seal mark */
        .seal-mark {
            display:inline-block; width:56px; height:56px; border-radius:50%;
            border:2px solid #D43A2F; color:#D43A2F; font-family:'Great Vibes',cursive;
            font-size:20px; line-height:56px; text-align:center; letter-spacing:0.06em;
            background:rgba(212,58,47,0.04); user-select:none; transition:transform 0.2s;
        }
        .seal-mark:active { transform:scale(0.95); }
        .seal-mark-sm { width:40px; height:40px; font-size:14px; line-height:40px; }
        .seal-mark-lg { width:80px; height:80px; font-size:28px; line-height:80px; border-width:2.5px; }

        /* ===== HERO SEAL PULSE (scoped to .hero-seal) ===== */
        @keyframes seal-pulse {
          0%   { transform: scale(1);   opacity: 0.5; }
          100% { transform: scale(1.4); opacity: 0; }
        }
        .hero-seal::after {
          content: '';
          position: absolute; inset: 0; border-radius: 50%;
          border: 1.5px solid #D43A2F;
          animation: seal-pulse 0.9s ease-out 0.7s 1 backwards;
        }

        /* Spice & signature */
        .spice-icon { display:inline-block; color:#D43A2F; font-size:0.85rem; letter-spacing:0.04em; }
        .star-signature { display:inline-block; color:#D43A2F; font-size:1rem; line-height:1; }

        /* Word-by-word reveal (preserved for PinnedReveal) */
        .word-reveal { display:inline-block; overflow:hidden; white-space:nowrap; }
        .word-reveal span { display:inline-block; transform:translateY(100%); opacity:0; }

        /* Horizontal Snap Scroll */
        .snap-container { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scroll-padding: 1rem; }
        .snap-item { scroll-snap-align: start; flex-shrink: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Bottom Sheet Drag Handle */
        .drag-handle { touch-action: none; }

        /* prefers-reduced-motion */
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
            .cursor-dot, .cursor-ring { display:none !important; }
            body { cursor:auto !important; }
            .word-reveal span { transform:translateY(0) !important; opacity:1 !important; }
            .hero-seal::after { animation: none !important; }
        }

        /* Mobile-first tap targets */
        button, a, .tap-target { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
        @media (max-width: 640px) {
            .seal-mark-lg { width:64px; height:64px; font-size:22px; line-height:64px; }
            .magnetic-btn { padding:0.6rem 1.5rem; font-size:0.85rem; }
        }

        .lenis.lenis-smooth { scroll-behavior:auto; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior:contain; }
    </style>
</head>

        const HAS_GSAP = typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined' && typeof SplitText !== 'undefined';
        const HAS_LENIS = typeof Lenis !== 'undefined';

        const MOTION = {

                out: 'power4.out',

                stamp: 'back.out(1.7)',
                ink: 'power2.out'
            }

        // ---- FALLBACK SCROLL HELPER ----
        const scrollToEl = (el, offset = 0) => {
            if (!el) return;
            if (HAS_LENIS && lenis) {
                lenis.scrollTo(el, { offset: offset, duration: 1.2 });
            } else {
                const top = el.getBoundingClientRect().top + window.pageYOffset + offset;
                window.scrollTo({ top, behavior: 'smooth' });
            }
        };

        if (!HAS_GSAP) {
            document.documentElement.classList.add('no-motion');
            window.gsap = { registerPlugin: () => {}, set: () => {}, fromTo: () => {}, to: () => {}, ticker: { add: () => {}, lagSmoothing: () => {} } };
            window.ScrollTrigger = { create: () => {}, getAll: () => [], refresh: () => {}, kill: () => {} };
        } else {
            gsap.registerPlugin(ScrollTrigger, SplitText, CustomEase);
        }

        // ---- LENIS ----
        let lenis = null;
        if (HAS_LENIS) {
            lenis = new Lenis({
                duration:1.6, easing:(t)=>Math.min(1,1.001-Math.pow(2,-10*t)),
                orientation:'vertical', smoothWheel:true, wheelMultiplier:1, touchMultiplier:1.2,
            });
            if (HAS_GSAP) {
                lenis.on('scroll', ScrollTrigger.update);
                gsap.ticker.add((time)=>lenis.raf(time*1000));
                gsap.ticker.lagSmoothing(0);
            }
        }

        // ---- CURSOR (conditional) ----
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
        const dot = document.getElementById('cursorDot');
        const ring = document.getElementById('cursorRing');
        if (!isTouchDevice && dot && ring && HAS_GSAP) {
            document.body.classList.add('cursor-active');
            document.addEventListener('mousemove', (e)=>{
                const x=e.clientX, y=e.clientY;
                dot.style.transform = `translate(${x-4}px, ${y-4}px)`;
                ring.style.transform = `translate(${x-20}px, ${y-20}px)`;
            });
            document.addEventListener('mouseover', (e) => {
                if (e.target.closest('a, button, .dish-card-trigger, .seal-mark, .magnetic-btn')) {
                    ring.classList.add('hover');
                }
            });
            document.addEventListener('mouseout', (e) => {
                if (e.target.closest('a, button, .dish-card-trigger, .seal-mark, .magnetic-btn')) {
                    ring.classList.remove('hover');
                }
            });
            document.addEventListener('mouseleave', ()=>{ dot.style.opacity='0'; ring.style.opacity='0'; });

            useEffect(() => {
                if (!ref.current || isVisible) return;
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.disconnect();
                    }
                }, { rootMargin: '200px' });
                observer.observe(ref.current);

            }, [isVisible]);

                        const skew = clamp(self.getVelocity() / -400);
                        if (Math.abs(skew) > Math.abs(proxy.skew)) {

                                onUpdate: () => {

            const ref = useRef(null);
            const isMobile = useMobile();

            useEffect(() => {
                const el = ref.current;
                if (!el || !HAS_GSAP) return;

                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                if (reduceMotion) {
                    if (variant === 'rise' || variant === 'scale') {
                        const targets = Array.from(el.children);
                        gsap.set(targets, variant === 'rise' ? { y: 0, opacity: 1 } : { scale: 1, opacity: 1 });

        // ---- SiteHeader + MobileDrawer ----

        // ---- Hero ----
        const Hero = () => {
            const heroRef = useRef(null);
            const sealRef = useRef(null);
            const textRef = useRef(null);
            const svgRef = useRef(null);
            const wordmarkRef = useRef(null);
            const buttonsRowRef = useRef(null);
            const underlineRef = useRef(null);

            // Botanical stroke-draw effect
            useEffect(() => {
                if (!HAS_GSAP) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    const paths = svgRef.current.querySelectorAll('.botanical-path');
                    paths.forEach(path => { path.style.strokeDashoffset = 0; });
                    return;
                }
                const ctx = gsap.context(() => {
                    const paths = svgRef.current.querySelectorAll('.botanical-path');
                    const totalLengths = [];
                    paths.forEach(path => { const length = path.getTotalLength(); path.style.strokeDasharray = length; path.style.strokeDashoffset = length; totalLengths.push(length); });
                    ScrollTrigger.create({ trigger: document.body, start: 'top top', end: 'bottom bottom', onUpdate: self => { const progress = self.progress; paths.forEach((path, i) => { path.style.strokeDashoffset = totalLengths[i] * (1 - progress); }); } });
                }, heroRef);
                return () => ctx.revert();
            }, []);

            // Kinetic wordmark and underline
            useEffect(() => {
                if (!HAS_GSAP) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                let split;
                const ctx = gsap.context(() => {
                    const isMobile = window.innerWidth < 768;
                    const mult = isMobile ? 0.75 : 1;

                    try {
                        split = SplitText.create(wordmarkRef.current, { type: 'chars', mask: 'chars' });
                        gsap.fromTo(split.chars,
                            { yPercent: 110, opacity: 0 },
                            { yPercent: 0, opacity: 1, duration: MOTION.dur.xl * mult, stagger: 0.06, ease: MOTION.ease.out, delay: 0.3 }
                        );
                    } catch (e) {
                        gsap.fromTo(wordmarkRef.current, { y: 24, opacity: 0 },
                            { y: 0, opacity: 1, duration: MOTION.dur.md * mult, ease: MOTION.ease.out, delay: 0.3 }
                        );
                    }

                    const path = underlineRef.current?.querySelector('path');
                    if (path) {
                        const len = path.getTotalLength();
                        gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
                        gsap.to(path, { strokeDashoffset: 0, duration: MOTION.dur.xl * mult, ease: MOTION.ease.ink, delay: 0.9 });
                    }
                }, heroRef);
                return () => { ctx.revert(); if (split) split.revert(); };
            }, []);

            // Scroll-linked parallax exit
            useEffect(() => {
                if (!HAS_GSAP) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const ctx = gsap.context(() => {
                    const tl = gsap.timeline({
                        scrollTrigger: { trigger: heroRef.current, start: 'top top', end: 'bottom top', scrub: 1 }
                    });
                    tl.to(textRef.current,      { yPercent: -30, opacity: 0 }, 0)
                      .to(sealRef.current,      { yPercent: -60, scale: 0.8 }, 0)
                      .to(svgRef.current,       { yPercent: -15 }, 0)
                      .to(buttonsRowRef.current,{ opacity: 0 }, 0);
                }, heroRef);
                return () => ctx.revert();
            }, []);

            // Ambient video layer
            const showVideo = HERO_VIDEO_SRC && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && !(navigator.connection && navigator.connection.saveData);

            return (
                <section ref={heroRef} className="relative min-h-screen flex items-center justify-center px-4 sm:px-8 overflow-hidden">
                    {showVideo && (
                        <video
                            className="absolute inset-0 w-full h-full object-cover opacity-[0.18] pointer-events-none"
                            src={HERO_VIDEO_SRC} autoPlay muted loop playsInline preload="none" aria-hidden="true"
                        />
                    )}
                    <svg ref={svgRef} className="botanical-svg absolute inset-0 w-full h-full pointer-events-none opacity-25" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet">
                        <path className="botanical-path" d="M200,100 C300,50 400,150 350,250 C300,350 400,450 450,350 C500,250 600,300 550,400 C500,500 600,600 650,500" />
                        <path className="botanical-path" d="M700,150 C800,200 750,300 650,350 C550,400 600,500 700,450 C800,400 850,500 800,550" />
                        <path className="botanical-path" d="M100,400 C150,350 250,450 200,550 C150,650 300,700 350,600" />
                        <circle className="botanical-path" cx="400" cy="200" r="40" />
                        <circle className="botanical-path" cx="700" cy="500" r="30" />
                    </svg>
                    <div className="relative z-10 text-center max-w-3xl mx-auto">
                        <div ref={sealRef} className="flex justify-center mb-6 sm:mb-10">
                            <Reveal variant="stamp" as="div" className="inline-block">
                                <div className="seal-mark seal-mark-lg hero-seal relative">歓</div>
                            </Reveal>
                        </div>
                        <div ref={textRef}>
                            <h1 ref={wordmarkRef} className="script-head text-[clamp(2.8rem,16vw,7rem)] text-forest leading-[1.1] hero-line">Yokoso</h1>
                            <svg ref={underlineRef} className="mx-auto mt-2 sm:mt-3 block" width="180" height="14" viewBox="0 0 180 14" style={{ maxWidth: '40%' }} aria-hidden="true">
                                <path d="M4,8 Q45,2 90,7 T176,6" fill="none" stroke="#D43A2F" strokeWidth="2.5" strokeLinecap="round" />
                            </svg>
                            <Reveal variant="rise" stagger={0.12} delay={1.1} as="div" className="mt-1 sm:mt-2">
                                <p className="serif-head text-[clamp(1rem,3vw,2rem)] text-forest-light/80 hero-line tracking-wide">Pan-Asian Restaurant</p>
                                <p className="sans-body text-xs sm:text-base text-forest-light/70 mt-3 max-w-[280px] sm:max-w-md mx-auto hero-line">Al Madani Tower (2nd Floor), Mirboxtula, Sylhet.</p>
                            </Reveal>
                        </div>
                        <div ref={buttonsRowRef} className="mt-6 sm:mt-10 hero-line flex flex-wrap justify-center gap-3 sm:gap-4">
                            <Reveal variant="rise" stagger={0.12} delay={1.4} as="div" className="flex flex-wrap justify-center gap-3 sm:gap-4">
                                <a href={WHATSAPP_RESERVE_URL} target="_blank" rel="noopener noreferrer" className="magnetic-btn text-sm sm:text-base">Reserve a Table</a>
                                <button className="magnetic-btn magnetic-btn-outline text-sm sm:text-base" onClick={() => scrollToEl(document.getElementById('menu-start'), -80)}>Explore Menu</button>
                            </Reveal>
                        </div>
                    </div>
                </section>
            );
        };

        // ---- PinnedReveal (unpinned) ----
        const PinnedReveal = () => {
            const ref = useRef(null);
            const words = ['Every', 'dish', 'tells', 'a', 'story.'];
            const isMobile = useMobile();

            useEffect(() => {
                if (!HAS_GSAP) return;
                const el = ref.current;
                if (!el) return;
                const spans = el.querySelectorAll('.word-reveal span');
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || isMobile) {
                    gsap.set(spans, { y: '0%', opacity: 1 });
                    return;
                }
                const tl = gsap.timeline({
                    scrollTrigger: {
                        trigger: el,
                        start: 'top 75%',
                        toggleActions: 'play none none none'
                    }
                });
                tl.fromTo(spans, { y: '100%', opacity:0 }, { y:'0%', opacity:1, duration:0.8, stagger:0.15, ease:'power2.out' });
            }, [isMobile]);

            return (
                <section ref={ref} className="h-screen flex items-center justify-center bg-bone-dark/20 relative overflow-hidden">
                    <div className="botanical-bg absolute inset-0 opacity-20 pointer-events-none" />
                    <div className="text-center px-4">
                        <div className="text-3xl sm:text-5xl md:text-7xl serif-head text-forest leading-tight">
                            {words.map((word, i) => (<span key={i} className="word-reveal inline-block mx-1"><span>{word}</span></span>))}
                        </div>
                        <p className="sans-body text-xs sm:text-base text-forest-light/70 mt-4 sm:mt-6 max-w-md mx-auto">— from our kitchen to your table</p>
                    </div>
                </section>
            );
        };

        // ---- About (with id="about" and updated hours) ----
        const About = () => {
            return (
                <section id="about" className="skew-target py-12 sm:py-24 px-4 sm:px-8 max-w-4xl mx-auto text-center">
                    <Reveal variant="ink" as="div" className="w-full">
                        <div className="relative">
                            <div className="botanical-bg absolute inset-0 opacity-30 pointer-events-none" />
                            <Reveal variant="rise" stagger={0.15} as="div">
                                <p className="about-line script-head text-2xl sm:text-3xl text-forest-light/60">一皿 一皿</p>
                                <h2 className="about-line serif-head text-2xl sm:text-4xl text-forest mt-2">Where the East meets the East</h2>
                                <p className="about-line sans-body text-sm sm:text-lg text-forest-light/80 mt-3 leading-relaxed max-w-2xl mx-auto">At Yokoso, we honour the culinary threads that bind Asia—from the bustling streets of Tokyo to the spice gardens of Bangkok, from Seoul's fermented traditions to the tropical soul of Manila. Every dish is a conversation, every plate a journey.</p>
                                <div className="about-line h-px bg-forest/10 w-20 mx-auto my-5" />
                                <p className="about-line sans-body text-xs sm:text-sm text-forest-light/70">Al Madani Tower (2nd Floor), Mirboxtula, Sylhet.<br />Open daily · 12:30 PM – 11:00 PM (Fri from 2:00 PM)</p>
                            </Reveal>
                        </div>
                    </Reveal>
                </section>
            );
        };

        // ---- Location (now <footer>, with updated hours) ----
        const Location = () => {
            return (
                <footer id="location" className="py-16 sm:py-24 px-4 sm:px-8 bg-bone-dark/40 border-t border-forest/5">
                    <div className="max-w-3xl mx-auto text-center">
                        <Reveal variant="stamp" as="div" className="inline-block mx-auto mb-4">
                            <span className="seal-mark seal-mark-sm">〒</span>
                        </Reveal>
                        <Reveal variant="rise" stagger={0.12} as="div">
                            <h2 className="script-head text-4xl sm:text-6xl text-forest">Find Us</h2>
                            <p className="serif-head text-lg sm:text-xl text-forest-light/80 mt-1">Al Madani Tower (2nd Floor), Mirboxtula, Sylhet.</p>
                            <p className="sans-body text-xs sm:text-sm text-forest-light/70 mt-3">
                                Open daily · 12:30 PM – 11:00 PM (Fri from 2:00 PM)<br />
                                <a href={`tel:+${RESERVATION_PHONE}`} className="underline-draw">01841965676</a>
                                {CONTACT_EMAIL && <> · <a href={`mailto:${CONTACT_EMAIL}`} className="underline-draw">{CONTACT_EMAIL}</a></>}
                            </p>
                            <a href={WHATSAPP_RESERVE_URL} target="_blank" rel="noopener noreferrer" className="magnetic-btn mt-6 inline-flex">Reserve on WhatsApp</a>
                            <div className="flex justify-center flex-wrap gap-4 sm:gap-6 mt-6 sm:mt-8">
                                <a href="https://www.facebook.com/share/192xaTJHwX/" target="_blank" rel="noopener noreferrer" className="underline-draw text-xs sm:text-sm text-forest-light/80 transition-colors tap-target">Facebook</a>
                                <a href="https://www.instagram.com/yokosobd?igsh=MTQ4bHp4Mm1sbjNwYg==" target="_blank" rel="noopener noreferrer" className="underline-draw text-xs sm:text-sm text-forest-light/80 transition-colors tap-target">Instagram</a>
                                {DELIVERY_URL && <a href={DELIVERY_URL} target="_blank" rel="noopener noreferrer" className="underline-draw text-xs sm:text-sm text-forest-light/80 transition-colors tap-target">Delivery</a>}
                            </div>
                            <p className="text-[10px] sm:text-xs text-forest-light/50 mt-8 sm:mt-10">© {new Date().getFullYear()} Yokoso · Sylhet</p>
                        </Reveal>
                    </div>
                </footer>
            );
        };

        // ---- LazyLoad Wrapper ----
        const LazySection = ({ children, className }) => {
            const { ref, isVisible } = useLazyLoad();
            return <div ref={ref} className={className}>{isVisible ? children : <div className="h-screen w-full"></div>}</div>;
        };

        // ---- App ----
        const App = () => {
            const [selectedDish, setSelectedDish] = useState(null);
            useScrollSkew();

            const handleResize = useCallback(() => {
                ScrollTrigger.refresh();
            }, []);

            useEffect(() => {
                setTimeout(() => ScrollTrigger.refresh(), 400);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, [handleResize]);

            return (
                <>
                    <a href="#menu-start" className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-vermilion focus:text-bone focus:px-4 focus:py-2 focus:rounded">Skip to menu</a>
                    <SiteHeader />
                    <main id="main-content">
                        <Hero />
                        <PinnedReveal />
                        <About />
                        <MenuCompass />
                        <LazySection className="w-full"><ChefSignatures onDishClick={setSelectedDish} /></LazySection>
                        <LazySection className="w-full"><CinematicCollections /></LazySection>
                        <MenuWrapper onDishClick={setSelectedDish} />
                    </main>
                    <Location />
                    <DishDetail dish={selectedDish} isOpen={!!selectedDish} onClose={() => setSelectedDish(null)} />
                </>
            );
        };

        // ---- RENDER ----
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        requestAnimationFrame(() => setTimeout(() => ScrollTrigger.refresh(), 200));
        window.addEventListener('load', () => setTimeout(() => ScrollTrigger.refresh(), 400));
    </script>
</body>
</html>
